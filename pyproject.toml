[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dhu-shell-assistant"
version = "1.0.0"
description = "A Linux terminal assistant with offline command knowledge and optional LLM support"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
lab-shell = "lab_shell.cli:main"

[tool.setuptools.packages.find]
include = ["lab_shell*"]
